name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Structura ${{ github.ref_name }}
          releaseBody: |
            ## Installers

            Download the right installer for your OS below.

            - **Windows** — `.msi` (standard) or `-setup.exe` (NSIS, smaller). SmartScreen may warn "Unknown publisher" — click *More info → Run anyway*.
            - **macOS** — `.dmg` (universal, Intel + Apple Silicon). If macOS says the app is "damaged", run in Terminal:
              `xattr -cr /Applications/Structura.app`
              This strips the quarantine flag (the app is unsigned — a $99/year Apple Developer ID is out of scope for now).
            - **Linux** — `.deb` for Debian/Ubuntu, or `.AppImage` (portable, `chmod +x` then run).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
